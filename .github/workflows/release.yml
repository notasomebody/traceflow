name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: 测试并构建本地后端
        working-directory: backend
        run: ./mvnw.cmd package --batch-mode
      - name: 生成精简 Java 运行时
        shell: pwsh
        run: |
          jlink --add-modules java.base,java.desktop,java.instrument,java.logging,java.management,java.naming,java.net.http,java.prefs,java.rmi,java.security.jgss,java.security.sasl,java.sql,java.transaction.xa,java.xml,java.xml.crypto,jdk.crypto.ec,jdk.unsupported --strip-debug --no-header-files --no-man-pages --compress=zip-6 --output frontend/src-tauri/runtime
      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci
      - name: 测试前端
        working-directory: frontend
        run: npm test
      - name: 检查前端代码
        working-directory: frontend
        run: npm run lint
      - name: 测试桌面端
        working-directory: frontend/src-tauri
        run: cargo test
      - name: 构建 Windows 安装包
        working-directory: frontend
        run: npm run desktop:build -- --bundles nsis
      - name: 生成稳定下载文件名
        shell: pwsh
        run: |
          $installer = Get-ChildItem frontend/src-tauri/target/release/bundle/nsis/*_x64-setup.exe | Select-Object -First 1
          if ($null -eq $installer) { throw "未找到 Windows x64 安装包" }
          Copy-Item -LiteralPath $installer.FullName -Destination frontend/src-tauri/target/release/bundle/nsis/TraceFlow-Windows-x64-setup.exe
      - name: 生成 SHA-256
        shell: pwsh
        run: |
          $files = @(
            Get-Item frontend/src-tauri/target/release/bundle/nsis/TraceFlow-Windows-x64-setup.exe
            Get-Item scripts/install-latest.ps1
          )
          $files | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))"
          } | Set-Content frontend/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt -Encoding utf8
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/src-tauri/target/release/bundle/nsis/TraceFlow-Windows-x64-setup.exe
            frontend/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
            scripts/install-latest.ps1
          generate_release_notes: true
